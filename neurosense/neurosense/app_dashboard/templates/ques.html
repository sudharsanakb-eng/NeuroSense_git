<!-- MAKE AN APPOINTMENT -->
{% load static %}
{% include "layout/partials/guest/header.html" %}
<section id="appointment" data-stellar-background-ratio="3">
    <div class="container">
        <div class="row">

            <div class="col-md-6 col-sm-6">
                <img src="{% static 'guest/images/appointment-image.jpg' %}" class="img-responsive" alt="">
            </div>

            <div class="col-md-6 col-sm-6">
                <!-- CONTACT FORM HERE -->
                <form id="appointment-form" role="form" method="POST" action="{% url 'dashboard:qview'  %}">
                    {% csrf_token %}


                    <!-- SECTION TITLE -->
                    <div class="section-title wow fadeInUp" data-wow-delay="0.4s">
                        <h2>Questions </h2>
                    </div>
                    {% for i in vdi %}


                    <div class="col-md-12 col-sm-12">
                        <label for="telephone">{{i.question}}</label>
                        <input type="text" class="form-control" id="question" name="question" placeholder="Answer">
                        
                    </div>
                    {% endfor %}
                    <button type="submit" class="form-control" id="cf-submit" name="submit">SUBMIT</button>
            </form>
             </div>
        </div>
    </div>
</section>
{% include "layout/partials/guest/footer.html" %}
