  {% load static %}
  {% include "layout/partials/counsellor/header.html" %}

     <!-- NEWS -->
     <section id="news" data-stellar-background-ratio="2.5">
          <div class="container">
               <div class="row">

                    <div class="col-md-12 col-sm-12">
                         <!-- SECTION TITLE -->
                         <div class="section-title wow fadeInUp" data-wow-delay="0.1s">
                              <h2>Our counsellors</h2>
                         </div>
                    </div>

                   {% for i in vdi %}

                    <div class="col-md-4 col-sm-6">
                         <!-- NEWS THUMB -->
                         <div class="news-thumb wow fadeInUp" data-wow-delay="0.8s">
                              <a href="{% url 'user:vdetail' i.id %}">
                                   <img src="/media/{{i.photo}}" class="img-responsive" alt="">
                              </a>
                              <div class="news-info">
                                   <div class="author">
                                        
                                        <div class="author-info">
                                             <h5>Name:-{{i.user.name}}</h5>
                                             <h5>Specialization:-{{i.special}}</h5>
                                             <p>Experienece:-{{i.exp}}</p>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>
                {% endfor %}
               </div>
          </div>
     </section>
{% include "layout/partials/counsellor/footer.html" %}
